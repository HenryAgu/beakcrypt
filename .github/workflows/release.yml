name: Release CLI

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=beakcrypt

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm publish --filter=beakcrypt --no-git-checks
          title: "chore: release beakcrypt"
          commit: "chore: release beakcrypt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
